    <script>
      window.__append = function (n) {
        var timeline = document.getElementById('timeline');
        for (var i = 0; i < n; i++) {
          var id = 3000 + i;
          var article = document.createElement('article');
          article.setAttribute('data-testid', 'tweet');
          article.innerHTML =
            '<div data-testid="User-Name"><a href="/user' + id + '"><span>User ' + id + '</span></a></div>' +
            '<a href="/user' + id + '/status/' + id + '"><time datetime="2026-10-17T11:00:00.000Z">now</time></a>' +
            '<div data-testid="tweetText"><span>Appended post ' + id + '</span></div>' +
            '<div role="group" aria-label="1 reply, 1 repost, 1 like, 10 views"></div>';
          timeline.appendChild(article);
        }
      };
    </script>
