<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X passive copilot</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header>
      <h1 id="title"></h1>
      <span id="power-label" class="power-label" data-testid="power-label"></span>
      <input id="power-toggle" type="checkbox" role="switch" aria-label="Capture on/off" />
    </header>
    <section id="doctor" aria-label="Readiness"></section>
    <nav role="tablist" class="tabs">
      <button role="tab" type="button" data-view="all" aria-selected="true">All</button>
      <button role="tab" type="button" data-view="flagged" aria-selected="false">Flagged</button>
    </nav>
    <main id="app"></main>
    <script type="module" src="panel.js"></script>
  </body>
</html>
